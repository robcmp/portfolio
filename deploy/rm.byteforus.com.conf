# Nginx site for the portfolio (Cloudflare proxied, Let's Encrypt certificate via certbot webroot).
# Path on VPS: /etc/nginx/sites-available/portfolio
# Requires:    /etc/nginx/snippets/portfolio-security-headers.conf (copy of deploy/portfolio-security-headers.conf)

server {
    listen 80;
    server_name rm.byteforus.com;

    # certbot webroot challenge (initial issue and renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/portfolio-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rm.byteforus.com;

    # Issued with: certbot certonly --webroot -w /var/www/portfolio-acme -d rm.byteforus.com
    ssl_certificate     /etc/letsencrypt/live/rm.byteforus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rm.byteforus.com/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/portfolio;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx drops server-level add_header inside a location that sets its own,
    # so the snippet is included in every block.
    include /etc/nginx/snippets/portfolio-security-headers.conf;

    # Hashed build assets: cache for a year
    location /_astro/ {
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /index.html;
}
